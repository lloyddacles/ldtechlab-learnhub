; Restricted PHP configuration for the tutorial sandbox
; This limits what user-submitted code can do

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_errno,pcntl_strerror,pcntl_getpid

; Restrict file access to temp directory only
open_basedir = /tmp:/var/folders/

; Disable URL wrappers
allow_url_fopen = Off
allow_url_include = Off

; Error handling
display_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
log_errors = Off

; Resource limits
max_execution_time = 5
max_input_time = 5
memory_limit = 32M

; Disable potentially dangerous settings
expose_php = Off
